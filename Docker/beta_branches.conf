# Beta branch configuration for Valheim server version locking
# Format: ENV_VAR_NAME=beta_branch_name

# Available branches from Steam Game Versions & Betas page:
export BETA_DEFAULT="public"           # Latest public version (Feb 19, 2026)
export BETA_OLD="default_old"                  # Previous stable (Feb 2, 2026)
export BETA_PREAL="default_preal"              # Before Ashlands (Oct 3, 2025)
export BETA_PREBW="default_prebw"              # Before Bog Witch (Oct 3, 2025)
export BETA_PRECTA="default_precta"            # Before Call to Arms (Oct 3, 2025)

# Default locked branch for production
LOCKED_BETA_BRANCH="${BETA_DEFAULT}"             # Change as needed
